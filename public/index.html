<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Generator</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding: 40px; }
        .box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 600px; }
        h1 { font-size: 24px; color: #333; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; }
        #result { margin-top: 25px; white-space: pre-wrap; background: #fafafa; border: 1px solid #eee; padding: 15px; border-radius: 6px; color: #444; font-size: 15px; min-height: 100px; }
        .error { color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h1>📧 Cold Email AI</h1>
        <input type="text" id="urlInput" placeholder="Paste job description URL here...">
        <button id="btn" onclick="run()">Generate Cold Email</button>
        <div id="result">The email will appear here...</div>
    </div>

    <script>
        async function run() {
            const url = document.getElementById('urlInput').value;
            const btn = document.getElementById('btn');
            const resultDiv = document.getElementById('result');

            if (!url) return alert("Enter a URL first!");

            // UI Updates
            btn.disabled = true;
            btn.innerText = "Processing...";
            resultDiv.innerText = "Analyzing job page and writing email...";
            resultDiv.classList.remove('error');

            try {
                const response = await fetch('/generate-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerText = data.email;
                } else {
                    resultDiv.innerText = "Server Error: " + (data.error || "Unknown Error");
                    resultDiv.classList.add('error');
                }
            } catch (err) {
                resultDiv.innerText = "Network Error: Could not connect to server.";
                resultDiv.classList.add('error');
            } finally {
                btn.disabled = false;
                btn.innerText = "Generate Cold Email";
            }
        }
    </script>
</body>
</html>
